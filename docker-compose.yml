services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data

  web:
    build: ./web
    ports:
      - "8080:8080"
    volumes:
      - ./web/public:/app/public
    depends_on:
      - db
      - ws

  ws:
    build: ./ws
    ports:
      - "8081:8081"

volumes:
  db_data:
